# Géré par eidos-lab-fr/agent-platform. La logique est dans le workflow réutilisable.
name: Agents de review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: startsWith(github.head_ref, 'agent/')
    uses: eidos-lab-fr/agent-platform/.github/workflows/reusable-pr-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
