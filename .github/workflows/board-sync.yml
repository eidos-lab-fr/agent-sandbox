name: Synchro du board

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  bloque:
    if: github.event.label.name == 'needs-human'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Board → Bloqué
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORG: ${{ vars.ORG || github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
        run: bash .github/scripts/set-status.sh "${{ github.event.issue.html_url }}" "${{ vars.OPT_BLOQUE }}"
